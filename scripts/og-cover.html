<!doctype html><html lang="es"><head><meta charset="utf-8"><style>
@font-face{font-family:Outfit;font-weight:100 900;src:url(../public/fonts/outfit-latin.woff2) format("woff2")}
@font-face{font-family:Satoshi;font-weight:400;src:url(../public/fonts/satoshi-400.woff2) format("woff2")}
@font-face{font-family:Satoshi;font-weight:500;src:url(../public/fonts/satoshi-500.woff2) format("woff2")}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#E8E0D0;font-family:Satoshi,sans-serif;color:#1A1613;position:relative}
.text{position:absolute;left:76px;top:0;bottom:0;width:570px;display:flex;flex-direction:column;justify-content:center}
.eyebrow{font-weight:500;font-size:17px;letter-spacing:.3em;text-transform:uppercase;color:#B33A0E;margin-bottom:30px}
h1{font:500 82px/1.12 Outfit;letter-spacing:-.025em;color:#1A1613}
h1 span{color:#D2491A;white-space:nowrap}
.lead{margin-top:30px;font-size:26px;line-height:1.5;color:rgba(26,22,19,.7);font-weight:400}
.lead b{font-weight:500;color:#B33A0E}
.url{margin-top:34px;font-weight:500;font-size:20px;letter-spacing:.1em;text-transform:uppercase;color:#1A1613}
.card{position:absolute;right:76px;top:75px;width:480px;height:480px;border-radius:2rem;padding:2px;background:linear-gradient(135deg,#FF7A4F,rgba(255,122,79,.05));box-shadow:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1)}
.in{width:100%;height:100%;border-radius:calc(2rem - 2px);overflow:hidden}
.in img{width:100%;height:100%;object-fit:cover;display:block;transform:translateY(14%) scale(1.38)}
</style></head><body>
<div class="text">
  <div class="eyebrow">Desarrollador web FullStack</div>
  <h1>Hola, soy <span>Julián Recarte</span></h1>
  <p class="lead">Convierto ideas en <b>experiencias web</b> interactivas para negocios que buscan destacar.</p>
  <div class="url">julianrecarte.dev</div>
</div>
<div class="card"><div class="in"><img src="../src/assets/images/yo.webp"></div></div>
</body></html>
